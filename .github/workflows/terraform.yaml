name: 'Terraform CI CD'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # 👈 This adds the "Run workflow" button to your GitHub UI

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: 'ap-south-1' 

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Terraform Engine
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8 

    - name: Verify Code Formatting
      run: terraform fmt -check

    - name: Initialize Backend and Providers
      run: |
        rm -rf .terraform .terraform.lock.hcl
        terraform init -upgrade

    - name: Run Trivy Security Scan
      uses: aquasecurity/trivy-action@v0.36.0 
      with:
        scan-type: 'config'
        hide-progress: false
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'
        skip-dirs: '.terraform' # 👈 Prevents Trivy from scanning large provider files

    - name: Execute Security Verified Plan
      run: |
        terraform plan -no-color > file.txt
        cat file.txt

    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-output
        path: file.txt

    - name: Automated Infrastructure Rollout
      if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
      run: terraform apply -auto-approve
